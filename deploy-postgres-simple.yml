---
- name: Desplegar PostgreSQL para SonarQube (Versión Simple)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    postgres_container_name: "postgres-sonar"
    postgres_image: "postgres:15"
    postgres_user: "sonar"
    postgres_password: "sonar"
    postgres_db: "postgres"
    postgres_host_port: "5432"
    volume_name: "postgres_data"

  tasks:
    - name: Verificar si Docker está disponible
      command: docker --version
      register: docker_check
      changed_when: false

    - name: Mostrar versión de Docker
      debug:
        msg: "Docker disponible: {{ docker_check.stdout }}"

    - name: Detener y eliminar contenedor PostgreSQL existente
      command: docker rm -f {{ postgres_container_name }}
      register: container_removed
      failed_when: false
      changed_when: "'{{ postgres_container_name }}' in container_removed.stdout"

    - name: Crear volumen Docker para PostgreSQL
      command: docker volume create {{ volume_name }}
      register: volume_result
      failed_when: false

    - name: Desplegar contenedor PostgreSQL
      command: >
        docker run -d
        --name {{ postgres_container_name }}
        --restart always
        -p {{ postgres_host_port }}:5432
        -e POSTGRES_USER={{ postgres_user }}
        -e POSTGRES_PASSWORD={{ postgres_password }}
        -e POSTGRES_DB={{ postgres_db }}
        -v {{ volume_name }}:/var/lib/postgresql/data
        {{ postgres_image }}
      register: postgres_result

    - name: Mostrar resultado del despliegue
      debug:
        msg: "Contenedor PostgreSQL desplegado con ID: {{ postgres_result.stdout }}"

    - name: Esperar a que PostgreSQL esté listo
      wait_for:
        host: "localhost"
        port: "{{ postgres_host_port }}"
        delay: 5
        timeout: 60

    - name: Verificar que el contenedor está corriendo
      command: docker ps --filter "name={{ postgres_container_name }}"
      register: container_status

    - name: Mostrar estado del contenedor
      debug:
        msg: "Estado del contenedor: {{ container_status.stdout }}"

    - name: Crear base de datos 'sonar'
      command: docker exec {{ postgres_container_name }} psql -U {{ postgres_user }} -d {{ postgres_db }} -c "CREATE DATABASE sonar;"
      register: db_created
      failed_when: false

    - name: Verificar creación de base de datos
      command: docker exec {{ postgres_container_name }} psql -U {{ postgres_user }} -d {{ postgres_db }} -c "\l sonar"
      register: db_check

    - name: Mostrar resultado de la base de datos
      debug:
        msg: "Base de datos 'sonar' {{ 'creada exitosamente' if db_check.rc == 0 else 'ya existía o hubo error' }}"

  post_tasks:
    - name: Resumen del despliegue
      debug:
        msg: |
          Despliegue de PostgreSQL completado:
          Contenedor: {{ postgres_container_name }}
          Base de datos: sonar
          Usuario: {{ postgres_user }}
          Puerto: {{ postgres_host_port }}
          Volumen: {{ volume_name }}