stages:
  - deploy

deploy-backend:
  stage: deploy
  image: ubuntu:22.04
  variables:
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY  # Asegúrate de tener esta variable en GitLab CI/CD Variables

  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H devops.jala.university >> ~/.ssh/known_hosts  # Solo el bastión

  script:
    - echo "✅ Probando conexión al bastión y servidor final..."
    - ssh -i ~/.ssh/id_rsa \
          -J spanish-b@devops.jala.university \
          -o StrictHostKeyChecking=accept-new \
          ubuntu@10.27.5.178 "echo 'Conexión SSH exitosa'"

    - echo "🚀 Iniciando despliegue Blue-Green en 10.27.5.178..."
    - |
      ssh -i ~/.ssh/id_rsa \
          -J spanish-b@devops.jala.university \
          -o StrictHostKeyChecking=accept-new \
          ubuntu@10.27.5.178 <<'EOF'
        set -e
        cd /home/ubuntu/backend
        echo "-> [1/3] Desplegando versión inactiva..."
        ./scripts/deploy_inactive.sh

        echo "-> [2/3] Validando despliegue..."
        ./scripts/validate.sh "$(cat active_deploy.txt)"

        echo "-> [3/3] Activando nueva versión..."
        ./scripts/switch.sh
        echo "✅ Despliegue Blue-Green finalizado"
      EOF