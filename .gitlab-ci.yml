deploy-backend:
  stage: deploy
  tags:
    - ubuntu  # ✅ Debe coincidir con el tag del runner (el que ves en la imagen: "ubuntu")
  image: ubuntu:22.04
  variables:
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H devops.jala.university >> ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/id_rsa \
          -J spanish-b@devops.jala.university \
          -o StrictHostKeyChecking=accept-new \
          ubuntu@10.27.5.178 <<'EOF'
        set -e
        cd /home/ubuntu/backend
        ./scripts/deploy_inactive.sh
        ./scripts/validate.sh "$(cat active_deploy.txt)"
        ./scripts/switch.sh
      EOF