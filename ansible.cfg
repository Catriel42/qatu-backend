[defaults]
inventory = ./inventory
host_key_checking = False
retry_files_enabled = False
roles_path = ./roles
collections_paths = ./collections

# Configuración de conexión
remote_user = ubuntu
ask_pass = False
ask_sudo_pass = False

# Configuración de ejecución
forks = 10
timeout = 30
gathering = smart
gather_facts = yes
gather_subset = all

# Configuración de módulos
module_lang = python3
interpreter_python = /usr/bin/python3

# Configuración de colores
# stdout_callback = yaml  # Comentado para evitar errores
# bin_ansible_callbacks = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
scp_if_ssh = True

[privilege_escalation]
# become = True  # Comentado para evitar problemas con localhost
# become_method = sudo
# become_user = root
# become_ask_pass = False