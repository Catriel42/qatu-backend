---
- name: Desplegar PostgreSQL para SonarQube
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    postgres_container_name: "postgres-sonar"
    postgres_image: "postgres:15"
    postgres_user: "sonar"
    postgres_password: "sonar"
    postgres_db: "postgres"
    postgres_host_port: "5432"
    postgres_container_port: "5432"
    volume_name: "postgres_data"

  tasks:
    - name: Verificar si Docker está disponible
      command: docker --version
      register: docker_check
      failed_when: docker_check.rc != 0
      changed_when: false

    - name: Crear volumen Docker para PostgreSQL
      docker_volume:
        name: "{{ volume_name }}"
        state: present
      register: volume_result

    - name: Mostrar información del volumen creado
      debug:
        msg: "Volumen {{ volume_name }} creado exitosamente"
      when: volume_result.changed

    - name: Detener y eliminar contenedor PostgreSQL existente
      docker_container:
        name: "{{ postgres_container_name }}"
        state: absent
      register: container_removed
      failed_when: false

    - name: Desplegar contenedor PostgreSQL
      docker_container:
        name: "{{ postgres_container_name }}"
        image: "{{ postgres_image }}"
        state: started
        restart_policy: always
        ports:
          - "{{ postgres_host_port }}:{{ postgres_container_port }}"
        env:
          POSTGRES_USER: "{{ postgres_user }}"
          POSTGRES_PASSWORD: "{{ postgres_password }}"
          POSTGRES_DB: "{{ postgres_db }}"
        volumes:
          - "{{ volume_name }}:/var/lib/postgresql/data"
        networks:
          - name: "sonar-network"
            driver: bridge
      register: postgres_result

    - name: Mostrar resultado del despliegue
      debug:
        msg: |
          Contenedor PostgreSQL desplegado exitosamente:
          - Nombre: {{ postgres_result.container.Name }}
          - ID: {{ postgres_result.container.Id }}
          - Estado: {{ postgres_result.container.State.Status }}
          - IP: {{ postgres_result.container.NetworkSettings.Networks['sonar-network'].IPAddress }}

    - name: Esperar a que PostgreSQL esté listo
      wait_for:
        host: "localhost"
        port: "{{ postgres_host_port }}"
        delay: 5
        timeout: 60
      register: wait_result

    - name: Verificar conexión a PostgreSQL
      command: |
        docker exec {{ postgres_container_name }} psql -U {{ postgres_user }} -d {{ postgres_db }} -c "SELECT version();"
      register: connection_test
      retries: 3
      delay: 5
      until: connection_test.rc == 0

    - name: Mostrar versión de PostgreSQL
      debug:
        msg: "PostgreSQL está funcionando: {{ connection_test.stdout_lines[0] }}"

    - name: Crear base de datos 'sonar'
      command: |
        docker exec {{ postgres_container_name }} psql -U {{ postgres_user }} -d {{ postgres_db }} -c "CREATE DATABASE sonar;"
      register: db_created
      failed_when: false

    - name: Verificar si la base de datos 'sonar' fue creada
      command: |
        docker exec {{ postgres_container_name }} psql -U {{ postgres_user }} -d {{ postgres_db }} -c "\l sonar"
      register: db_check

    - name: Mostrar resultado de la creación de la base de datos
      debug:
        msg: |
          Base de datos 'sonar' {{ 'creada exitosamente' if db_check.rc == 0 else 'ya existía o hubo un error' }}

    - name: Listar todas las bases de datos
      command: |
        docker exec {{ postgres_container_name }} psql -U {{ postgres_user }} -d {{ postgres_db }} -c "\l"
      register: db_list

    - name: Mostrar lista de bases de datos
      debug:
        msg: "Bases de datos disponibles:\n{{ db_list.stdout }}"

  post_tasks:
    - name: Resumen del despliegue
      debug:
        msg: |
          Despliegue de PostgreSQL completado:
          Contenedor: {{ postgres_container_name }}
          Base de datos principal: {{ postgres_db }}
          Base de datos SonarQube: sonar
          Usuario: {{ postgres_user }}
          Puerto: {{ postgres_host_port }}
          Volumen: {{ volume_name }}
          Red: sonar-network